services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fazum
      POSTGRES_USER: fazum_app
      POSTGRES_PASSWORD: change-me-only-in-local-env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazum_app -d fazum"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
