# Uses the SAME brand assets as the RN app (frontend/app.json's icon/adaptiveIcon,
# background #091323) — never new/invented artwork.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#091323"
  adaptive_icon_foreground: "assets/icon/adaptive-icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
